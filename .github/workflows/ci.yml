name: Formula1-AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Black + Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install black ruff
      - name: Black format check
        run: black --check src/ tests/ scripts/ dashboards/
      - name: Ruff lint
        run: ruff check src/ tests/ scripts/ dashboards/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=120
        env:
          PYTHONPATH: .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t formula1-ai:ci .
      - name: Smoke test API
        run: |
          docker run -d -p 8000:8000 --name f1-api formula1-ai:ci
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop f1-api
