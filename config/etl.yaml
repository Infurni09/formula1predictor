# Formula1-AI — ETL Configuration
# config/etl.yaml

etl:
  ergast:
    enabled: true
    base_url: https://api.jolpi.ca/ergast/f1
    season_start: 2018
    season_end: 2024
    rate_limit:
      calls: 4
      period_seconds: 1
    cache_dir: data/raw/ergast
    retry:
      max_retries: 3
      backoff_factor: 2.0

  openf1:
    enabled: false
    base_url: https://api.openf1.org/v1
    timeout_seconds: 30
    cache_dir: data/raw/openf1
    endpoints:
      - sessions
      - laps
      - telemetry
      - position
      - pit
      - weather
      - race_control
      - stints

  fastf1:
    enabled: false
    cache_dir: data/raw/fastf1_cache
    parquet_dir: data/raw/fastf1_parquet
    sessions: [Race, Qualifying, Sprint]
    season_start: 2018

  database:
    path: data/formula1_ai.duckdb
    memory_limit: 4GB
    threads: 4

  tables:
    - drivers
    - constructors
    - circuits
    - races
    - results
    - qualifying
    - sprint
    - pit_stops
    - laps
    - weather
    - telemetry
    - championship_standings
    - constructor_standings
    - engineered_features
