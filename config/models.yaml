# Formula1-AI — Model Configuration
# config/models.yaml

models:
  random_state: 42
  test_season: 2024
  validation_seasons: [2023]
  train_seasons: [2018, 2019, 2020, 2021, 2022, 2023]

  targets:
    winner:
      col: winner
      task: classification
      metric: roc_auc
    podium:
      col: podium
      task: classification
      metric: roc_auc
    dnf:
      col: dnf
      task: classification
      metric: roc_auc
    qualifying_position:
      col: quali_pos
      task: regression
      metric: mae
    finishing_position:
      col: position
      task: regression
      metric: mae
    championship_points:
      col: cumulative_points
      task: regression
      metric: r2
    pit_stop_timing:
      col: avg_pit_duration
      task: regression
      metric: mae

  optuna:
    n_trials: 100
    timeout_seconds: 3600
    sampler: TPESampler
    pruner: MedianPruner
    direction:
      classification: maximize
      regression: maximize  # negative MAE

  search_space:
    max_depth: [3, 12]
    learning_rate: [0.001, 0.3]
    n_estimators: [100, 2000]
    num_leaves: [20, 150]
    subsample: [0.5, 1.0]
    colsample_bytree: [0.5, 1.0]
    min_child_weight: [1, 10]
    reg_alpha: [1.0e-8, 10.0]
    reg_lambda: [1.0e-8, 10.0]

  ensemble:
    stacking_cv: 3
    voting_weights: auto

  mlflow:
    experiment_name: Formula1-AI
    tracking_uri: mlruns
    log_models: true
    log_artifacts: true
